name: Update Space News Data

on:
  schedule:
    # UTC 21:00 = KST 06:00 (다음날). GitHub Actions 스케줄은 UTC 기준입니다.
    - cron: "0 21 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼도 생깁니다.

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존 패키지 설치
        run: npm install

      - name: 뉴스 수집 스크립트 실행
        run: node scripts/fetch-news.js

      - name: 변경사항 있으면 자동 커밋
        run: |
          git config user.name "space-intel-news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "chore: 뉴스 자동 갱신 [skip ci]"
          git push
